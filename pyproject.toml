[project]
name = "kefiya"
authors = [
    { name = "Phamos GmbH", email = "support@phamos.eu" },
]
description = "FinTS Connector for ERPNext (Germany)"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "fints==5.0.0b1",
    # mt-940 5.x puts the counterparty IBAN (?31) in front of applicant_name
    # unless the parser gets Options(applicant_iban=True), which fints doesn't
    # pass. Stay on the 4.x mapping (phamos/kefiya#48).
    "mt-940>=4.30,<5",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "kefiya"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"
